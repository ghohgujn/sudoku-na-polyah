*{box-sizing:border-box}

body{min-height:100dvh;margin:0;background-color:var(--desk);background-image:radial-gradient(var(--grain) .65px,transparent .75px);background-size:3px 3px;color:var(--ink);font:16px/1.45 var(--body)}

button{cursor:pointer;background:none;border:0}

button:hover:not(:disabled),a:hover{color:var(--accent)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;font-family:var(--serif);font-weight:400;overflow-wrap:break-word;min-width:0}
.wrap{max-width:1090px;margin:auto;padding:0 36px}
.mast{height:76px;border-bottom:1px solid var(--edge);display:flex;align-items:center;justify-content:space-between}
.brand,.nav,.utility,.tools,.row,.info,.byline{display:flex;align-items:center}
.brand{gap:8px;font:italic 26px var(--serif)}
.mark{width:24px;height:24px;background:repeating-linear-gradient(90deg,transparent 0 6px,var(--accent) 6px 8px),repeating-linear-gradient(0deg,transparent 0 6px,var(--accent) 6px 8px);border:2px solid var(--accent);transform:rotate(-6deg)}
.nav{gap:16px}
.utility{gap:8px;font-size:.91rem;min-height:44px}
.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.65;flex:none}
.intro{display:flex;align-items:end;justify-content:space-between;padding:24px 0 16px}
.intro h1{font-size:clamp(54px,6vw,84px);line-height:1;letter-spacing:-.065em}
.new{border:1px solid var(--ink);border-radius:3px;padding:0 16px;gap:8px}
.new:hover{background:var(--paper)}

.sheet:before{content:'';position:absolute;inset:0 auto 0 10px;width:3px;border-inline:1px solid var(--rule);pointer-events:none}
.byline{justify-content:space-between;color:var(--sub);font:italic 15px var(--serif);margin:0 0 12px}
.byline span:first-child{color:var(--accent)}
.difficulty{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px;margin-block:-4px;border:1px solid var(--faint);border-radius:3px;color:var(--ink);font:14px var(--body)}
.difficulty::after{content:'';width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.difficulty:hover{background:var(--wash)}
.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));aspect-ratio:1;border:2px solid var(--ink);background:var(--paper);width:100%}
.cell{position:relative;display:grid;place-items:center;padding:0;min-width:0;min-height:0;font:clamp(21px,2.65vw,41px)/1 var(--serif);border-radius:0;border-right:1px solid var(--edge);border-bottom:1px solid var(--edge);user-select:none;-webkit-tap-highlight-color:transparent}
.cell:nth-child(3n){border-right:2px solid var(--ink)}
.cell:nth-child(9n){border-right:0}
.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--ink)}
.cell:nth-child(n+73){border-bottom:0}
.cell:hover:not(:disabled){color:inherit}
.cell.selected,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;background:var(--wash);z-index:1}
.cell.entered{font-style:italic;color:var(--pencil)}
.cell.partner{color:var(--green)}
.cell.entered:hover{color:var(--pencil)}
.notes{position:absolute;inset:3px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font:clamp(7px,.83vw,12px)/1 var(--body);color:var(--sub)}
.notes span{place-self:center}
.sheetfoot{margin-top:12px;display:flex;justify-content:space-between;align-items:center;font:italic 15px var(--serif);color:var(--sub)}

.clock .icon{width:15px}
.side{padding:8px 0 0}
.side h2{font-size:clamp(27px,2.7vw,36px);letter-spacing:-.04em}
.info{justify-content:space-between;border-bottom:1px solid var(--edge);padding-bottom:12px}
.tools{justify-content:space-between;gap:4px;margin:12px 0 16px}
.tool{display:flex;align-items:center;flex-direction:column;justify-content:center;gap:8px;padding:8px 4px;flex:1;min-height:57px;font-size:.82rem;border-radius:3px}
.tool .icon{width:21px;height:21px}
.tool:hover,.tool[aria-pressed=true]{background:var(--wash);color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{font:31px var(--serif);height:clamp(48px,4.4vw,62px);background:var(--paper);border:1px solid var(--faint);border-radius:3px;box-shadow:0 2px 0 var(--lines)}
.pad button:hover{border-color:var(--accent)}
.primary{background:var(--accent);color:var(--white);border-radius:3px;min-height:46px;padding:8px 16px}
.primary:hover:not(:disabled){background:var(--accent-dark);color:var(--white)}
.check{width:100%;margin-top:16px}
.help{font-size:.88rem;line-height:1.5;color:var(--sub);margin-top:8px}
.modeinfo{border-block:1px solid var(--edge);margin-top:24px;padding:16px 0}
.modeinfo h3{font-size:22px}
.modeinfo p{margin-top:4px;font-size:.9rem;color:var(--sub)}
.lined{border:1px solid var(--edge);min-height:44px;padding:8px 16px;border-radius:3px}
.modeinfo button{margin-top:8px}
.foot{border-top:1px solid var(--edge);padding:16px 0 24px;display:flex;justify-content:space-between;color:var(--sub);font-size:.85rem}
.foot a{text-underline-offset:4px}
.message{color:var(--accent);font-size:.9rem;margin-top:8px}
.message:empty{display:none}

.row{justify-content:space-between;gap:12px}

.close{font-size:26px;min-width:44px;height:44px}

.level-list small{color:var(--sub);font-size:.86rem}

dialog .primary{width:100%;margin-top:12px}

[hidden]{display:none!important}
#prints{display:none}

.tool{flex-direction:row;gap:8px;min-height:44px}

.modeinfo{margin-top:16px}
.sheetfoot{margin-top:8px}
.foot{gap:16px;flex-wrap:wrap}

.pad button{font-size:clamp(25px,7vw,32px)}
}

.pad{grid-template-columns:repeat(10,minmax(0,1fr))}

.pad button:nth-child(6){grid-column:2/span 2}
}
@media screen and (max-width:360px){
.brand{font-size:20px}
.nav .utility{gap:4px;padding-inline:4px}
}
@media print{@page{size:A4 portrait;margin:18mm}
body{background:var(--white)}
.wrap,dialog{display:none!important}
#prints{display:block}
.printsheet{break-after:page}
.printsheet:last-child{break-after:auto}
.printsheet h1{font-size:36pt}
.printsheet p{margin:4mm 0}
.printsheet .board{width:167mm;height:167mm}
.printsheet .cell{font-size:21pt}
.printsheet footer{margin-top:12mm}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
}

  el.outerHTML='<svg aria-hidden="true" class="icon" viewBox="0 0 24 24"><path d="'+paths[el.dataset.i]+'"/></svg>';
}
function shuffled(values) {
  const a=values.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function newPuzzle(level) {
  const bank=BANK[level], seed=bank[Math.floor(Math.random()*bank.length)];
  const digits=[0,...shuffled([1,2,3,4,5,6,7,8,9])];
  if(level>=2)return Array.from(seed,digit=>digits[Number(digit)]);
  const order=()=>shuffled([0,1,2]).flatMap(group=>shuffled([0,1,2]).map(n=>group*3+n));
  const rows=order(),cols=order(),transpose=Math.random()<.5;
  return rows.flatMap(r=>cols.map(c=>digits[+seed[transpose?c*9+r:r*9+c]]));
}
function emptyBoard(){return {values:Array(81).fill(0),notes:Array(81).fill(0),owners:Array(81).fill(0),history:[]}}
function startGame(mode,level,number,secondLevel=level) {
  let duel;
  if(mode==='duel'){
    const {sheets}=makeDuelSheets();
    duel={duelLevels:[level,secondLevel],duelSheets:[sheets[level],sheets[secondLevel]]};
  }
  return {mode,level,number,...duel,puzzle:duel?duel.duelSheets[0]:newPuzzle(level),boards:[emptyBoard(),emptyBoard()],player:0,
    phase:mode==='duel'?'ready':'play',times:[0,0],selected:-1,note:false};
}
const saveKey='na-polyah-sudoku.v2';
function loadGame() {
  try{
    const current=localStorage.getItem(saveKey);
    const g=JSON.parse(current??localStorage.getItem('na-polyah-sudoku.v1'));
    if(!current && g && Number.isInteger(g.level) && g.level>=0 && g.level<=2)g.level+=1;
    if(g&&g.mode!=='online'&&Object.hasOwn(modes,g.mode)&&levels[g.level]&&g.puzzle?.length===81&&
      g.boards?.every(b=>b.values.length===81&&b.notes.length===81&&b.owners.length===81&&Array.isArray(b.history))&&g.boards.length===2)return g;
  }catch{}
  return startGame('solo',2,1);
}
let game=loadGame(), tickStart=null, storageFailed=false;
const activeIndex=()=>game.mode==='duel'?game.player:0;
const activeBoard=()=>game.boards[activeIndex()];
function persist(){
  if(game.mode==='online')return;
  try{localStorage.setItem(saveKey,JSON.stringify(game))}
  catch{if(!storageFailed){storageFailed=true;$('message').textContent='Браузер не сохранил партию. Оставьте вкладку открытой.'}}
}
function settle(){
  if(tickStart!==null){game.times[activeIndex()]+=performance.now()-tickStart;tickStart=null}
}
function resume(){
  if(game.mode!=='online'&&tickStart===null&&!document.hidden&&game.phase==='play'&&!$('modal').open)tickStart=performance.now();
}
function formatTime(ms){
  const s=Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function clock(){
  if(game.mode==='online'){
    const ms=race?.result?.elapsedMs ?? (race?.startAt?Math.max(0,Date.now()-race.startAt):0);
    $('time').textContent=formatTime(ms);
    if(game.phase==='countdown' && $('countdown'))$('countdown').textContent=Math.max(1, Math.ceil((race.startAt-Date.now())/1000));
    return;
  }
  const current=game.times[activeIndex()]+(tickStart===null?0:performance.now()-tickStart);$('time').textContent=formatTime(current)}
setInterval(clock,500);
setInterval(()=>{settle();persist();resume()},5000);
document.addEventListener('visibilitychange',()=>{settle();persist();resume()});
window.addEventListener('pagehide',()=>{settle();persist()});
window.addEventListener('pageshow',resume);
const cells=[];
for(let i=0;i<81;i++){
  const cell=document.createElement('button');
  cell.addEventListener('focus',()=>{if(game.phase==='play'&&game.selected!==i){game.selected=i;drawCells()}});
  cell.className='cell';cell.addEventListener('click',()=>selectCell(i));
  $('board').append(cell);cells.push(cell);
}
for(let d=1;d<=9;d++){
  const button=document.createElement('button');button.textContent=d;
  button.setAttribute('aria-label','Вписать '+d);button.onclick=()=>edit(d);
  $('pad').append(button);
}
function selectCell(i){
  if(game.phase!=='play')return;
  game.selected=i;$('message').textContent='';drawCells();cells[i].focus({preventScroll:true});persist();
}
function drawCells(){
  const b=activeBoard();
  cells.forEach((cell,i)=>{
    const given=game.puzzle[i],value=given||b.values[i],bits=b.notes[i],selected=i===game.selected;
    cell.tabIndex=(selected||(game.selected===-1&&i===0))?0:-1;
    cell.className='cell'+(selected?' selected':'')+(!given&&value?' entered':'')+(b.owners[i]===1?' partner':'');
    cell.textContent=value||'';
    const notes=[];
    if(!value&&bits){
      const grid=document.createElement('span');grid.className='notes';
      for(let d=1;d<=9;d++){const span=document.createElement('span');if(bits&(1<<d)){span.textContent=d;notes.push(d)}grid.append(span)}
      cell.append(grid);
    }
    cell.setAttribute('aria-label','Строка '+(Math.floor(i/9)+1)+', столбец '+(i%9+1)+'. '+(given?'Дано '+given:value?'Вписано '+value:notes.length?'Пометки '+notes.join(', '):'Пусто'));
  });
}
function render(){
  $('folio').textContent='Лист № '+String(game.number).padStart(3,'0');
  const online=game.mode==='online';
  $('difficulty').textContent=online&&race.role==='guest'&&!race.connected?'Подключение…':'Уровень: '+levels[game.level];
  $('difficulty').disabled=online;
  $('onlinegame').hidden=online;
  $('new').lastChild.textContent=online?'Выйти из дуэли':'Новая партия';
  $('print').disabled=online;
  $('sheetmode').textContent=online?'Дуэль по ссылке':game.mode==='solo'?'Одиночная партия':modes[game.mode]+' / Игрок '+(game.player+1);
  $('modetitle').textContent={solo:'Одиночная партия',pair:'Общий лист',duel:'Дуэль на время',online:'Дуэль по ссылке'}[game.mode];
  $('pairgame').hidden=game.mode!=='solo';
  $('modedesc').textContent=descriptions[game.mode];$('pass').hidden=game.mode!=='pair'||game.phase!=='play';
  $('note').setAttribute('aria-pressed',String(game.note));
  const playable=game.phase==='play';
  for(const el of [...$('pad').children,$('note'),$('erase'),$('check')])el.disabled=!playable;
  $('undo').disabled=!playable||!activeBoard().history.length;
  $('board').hidden=!playable;$('cover').hidden=playable;
  if(playable)drawCells();else if(online)renderRaceCover();else renderCover();
  clock();
}
function renderCover(){
  const done=game.phase==='done',duel=game.mode==='duel';
  const title=document.createElement('h2'),body=document.createElement('p'),btn=document.createElement('button');
  btn.className='primary';
  if(done){
    let label=game.mode==='pair'?'Вы решили вместе!':'Лист решён!';
    if(duel){
      const [a,b]=game.times.map(t=>Math.floor(t/1000));label=a===b?'Ничья!':'Победил игрок '+(a<b?1:2);
    }
    title.textContent=label;body.textContent=duel?'Игрок 1 — '+formatTime(game.times[0])+'. Игрок 2 — '+formatTime(game.times[1])+'.':'Время решения — '+formatTime(game.times[0])+'.';
    btn.textContent='Новая партия';btn.onclick=setup;
  }else{
    title.textContent='Игрок '+(game.player+1);
    body.textContent=game.player?'Передайте устройство второму игроку.':'Второй игрок отворачивается. Начните, когда будете готовы.';
    btn.textContent='Открыть мой лист';btn.onclick=()=>{game.phase='play';persist();render();resume()};
  }
  $('cover').replaceChildren(title,body,btn);
}
function edit(d,clear=false){
  if(game.phase!=='play')return;
  const i=game.selected,b=activeBoard();
  if(i<0||game.puzzle[i]){$('message').textContent=i<0?'Сначала выберите клетку.':'Эта цифра напечатана на листе.';return}
  const mark=game.note&&!clear;
  if(mark&&b.values[i]){$('message').textContent='Для пометок сначала сотрите вписанную цифру.';return}
  const nextValue=clear||mark?0:d,nextNotes=mark?b.notes[i]^(1<<d):0;
  if(nextValue===b.values[i]&&nextNotes===b.notes[i])return;
  b.history.push([i,b.values[i],b.notes[i],b.owners[i]]);
  b.values[i]=nextValue;b.notes[i]=nextNotes;b.owners[i]=game.mode==='pair'?game.player:0;
  $('message').textContent='';persist();render();
}
function undo(){
  if(game.phase!=='play')return;
  const b=activeBoard(),entry=b.history.pop();if(!entry)return;
  const [i,v,n,o]=entry;b.values[i]=v;b.notes[i]=n;b.owners[i]=o;game.selected=i;
  $('message').textContent='';persist();render();
}
$('undo').onclick=undo;$('erase').onclick=()=>edit(0,true);
$('note').onclick=()=>{game.note=!game.note;persist();render()};
$('pass').onclick=()=>{game.player=1-game.player;game.selected=-1;game.note=false;$('message').textContent='';persist();render()};
function correct(values){
  if(!Array.isArray(values)||values.length!==81||!values.every(n=>Number.isInteger(n)&&n>=1&&n<=9))return false;
  const unique=a=>new Set(a).size===9;
  for(let k=0;k<9;k++){
    const row=[],col=[],box=[];
    for(let j=0;j<9;j++){
      row.push(values[k*9+j]);col.push(values[j*9+k]);box.push(values[(Math.floor(k/3)*3+Math.floor(j/3))*9+k%3*3+j%3]);
    }
    if(!unique(row)||!unique(col)||!unique(box))return false;
  }return true;
}
$('check').onclick=()=>{
  const vals=game.puzzle.map((v,i)=>v||activeBoard().values[i]);
  if(vals.includes(0)){$('message').textContent='Заполните весь лист перед проверкой.';return}
  if(!correct(vals)){$('message').textContent='Лист пока не сходится. Можно продолжить решение.';return}
  if(game.mode==='online'){
    if(race.submitted)return;
    race.submitted=true;
    $('message').textContent='Решение отправлено. Ждём результат.';
    if(!race.net.finish(vals) && game.phase==='play'){
      race.submitted=false;
      $('message').textContent='Не удалось передать результат. Попробуйте проверить лист ещё раз.';
    }
    return;
  }
  settle();game.selected=-1;game.note=false;$('message').textContent='';
  if(game.mode==='duel'&&game.player===0){
    game.player=1;game.phase='ready';
    if(game.duelSheets){game.level=game.duelLevels[1];game.puzzle=game.duelSheets[1]}
  }else game.phase='done';
  persist();render();
};
function dialog(title,html){
  settle();persist();$('dialogtitle').textContent=title;$('modal').setAttribute('aria-labelledby','dialogtitle');
  $('dialogbody').innerHTML=html;$('modal').showModal();
}
$('modal').querySelector('.close').onclick=()=>$('modal').close();
$('modal').addEventListener('close',resume);
function setup(){
  dialog('Новая партия','<label for="mode">Как играем</label><select id="mode"></select><p id="choice"></p><label id="level-label" for="level">Сложность</label><select id="level"></select><div id="duel-level-row" hidden><label for="second-level">Уровень игрока 2</label><select id="second-level"><option value="">Как у игрока 1</option></select></div><p id="replace"></p><button class="primary" id="begin">Начать партию</button>');
  for(const [id,name] of Object.entries(modes))$('mode').add(new Option(name,id));
  levels.forEach((name,i)=>{
    $('level').add(new Option(name,i));
    $('second-level').add(new Option(name,i));
  });
  $('mode').value=game.mode;$('level').value=game.duelLevels?.[0]??game.level;
  if(game.duelLevels && game.duelLevels[0]!==game.duelLevels[1])$('second-level').value=game.duelLevels[1];
  const warn=()=>{$('replace').textContent=$('mode').value==='online'?'Текущая партия сохранится на этом устройстве.':replacementNotice()};
  $('mode').onchange=()=>{
    const mode=$('mode').value;
    $('duel-level-row').hidden=mode!=='duel';
    $('level-label').textContent=mode==='duel'?'Уровень игрока 1':mode==='online'?'Мой уровень':'Сложность';
    $('choice').textContent=descriptions[$('mode').value];
    $('begin').textContent=$('mode').value==='online'?'Создать приглашение':'Начать партию';
    warn();
  };
  $('mode').onchange();
  $('begin').onclick=()=>{
    const mode=$('mode').value,level=Number($('level').value);
    if(mode==='online'){$('modal').close();openRace(level);return}
    newLocalSheet(mode,level,$('second-level').value===''?level:Number($('second-level').value));
  };
}
function replacementNotice(){
  return game.phase!=='done'&&(game.boards.some(b=>b.history.length)||game.mode==='duel'&&game.player===1)?'Новый лист заменит текущую партию.':'';
}
function newLocalSheet(mode,level,secondLevel=level){
  game=startGame(mode,level,game.number+1,secondLevel);
  $('modal').close();$('message').textContent='';persist();render();resume();
}
$('difficulty').onclick=()=>{
  if(game.mode==='duel'){setup();$('level').focus();return}
  dialog('Выберите сложность','<fieldset id="level" class="level-list"><legend class="sr">Сложность нового листа</legend></fieldset><p id="replace"></p><button class="primary" id="begin">Начать новый лист</button>');
  levels.forEach((name,i)=>{
    const item=document.createElement('label');
    item.innerHTML='<input type="radio" name="level" value="'+i+'"><strong>'+name+'</strong><small>'+levelDetails[i]+'</small>';
    item.firstChild.checked=i===game.level;
    $('level').append(item);
  });
  $('replace').textContent=replacementNotice();
  $('begin').onclick=()=>newLocalSheet(game.mode,Number($('level').querySelector(':checked').value));
};
$('new').onclick=()=>game.mode==='online'?askLeaveRace():setup();
$('onlinegame').onclick=()=>{setup();$('mode').value='online';$('mode').onchange()};
$('pairgame').onclick=()=>{setup();$('mode').value='pair';$('mode').onchange()};
$('rules').onclick=()=>dialog('Правила','<p>В каждой строке, каждом столбце и квадрате 3 × 3 должны встретиться все цифры от 1 до 9 по одному разу.</p><p>Пометки ставятся и стираются вручную. Повторный ввод той же цифры убирает её из пометок. Кнопка «Проверить лист» оценивает только законченное решение.</p><p>С клавиатуры используйте стрелки и цифры. Delete стирает запись, M переключает пометки, Ctrl или ⌘ + Z отменяет ход.</p><p>Сложность выбирается над полем. Для игры на двух устройствах выберите «Дуэль по ссылке». В комнате каждый выбирает свой уровень и нажимает «Готов». При одинаковом уровне стартовые поля совпадают.</p>');
document.addEventListener('keydown',e=>{
  if($('modal').open||game.phase!=='play'||e.altKey)return;
  if((e.ctrlKey||e.metaKey)&&['z','я'].includes(e.key.toLowerCase())){e.preventDefault();undo();return}
  if(e.ctrlKey||e.metaKey)return;
  if(/^[1-9]$/.test(e.key)){e.preventDefault();edit(+e.key);return}
  if(['m','ь'].includes(e.key.toLowerCase())){e.preventDefault();$('note').click();return}
  if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();edit(0,true);return}
  if(e.key.startsWith('Arrow')&&$('board').contains(document.activeElement)){
    e.preventDefault();const i=Math.max(0,game.selected),r=Math.floor(i/9),c=i%9;
    const offsets={ArrowLeft:[0,-1],ArrowRight:[0,1],ArrowUp:[-1,0],ArrowDown:[1,0]};
    const [dr,dc]=offsets[e.key];const clamp=x=>Math.max(0,Math.min(8,x));
    selectCell(clamp(r+dr)*9+clamp(c+dc));
  }
});
function printSheets(){
  if(game.mode==='online'){$('prints').replaceChildren();return}
  const pages=[];
  for(let p=0;p<(game.mode==='duel'?2:1);p++){
    const page=document.createElement('section');page.className='printsheet';
    const title=document.createElement('h1');title.textContent='Судоку на полях';
    const meta=document.createElement('p');meta.textContent=$('folio').textContent+' / '+levels[game.duelLevels?.[p]??game.level]+' / '+(game.mode==='duel'?'Игрок '+(p+1):modes[game.mode]);
    const board=document.createElement('div');board.className='board';
    for(const d of game.duelSheets?.[p]??game.puzzle){const cell=document.createElement('div');cell.className='cell';cell.textContent=d||'';board.append(cell)}
    const foot=document.createElement('footer');foot.textContent='Имя ____________________　　　 Время ______________';
    page.append(title,meta,board,foot);pages.push(page);
  }$('prints').replaceChildren(...pages);
}
window.addEventListener('beforeprint',printSheets);
$('print').onclick=()=>{printSheets();window.print()};
let race=null;
render();resume();persist();
</script>
